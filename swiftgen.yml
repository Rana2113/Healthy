input_dir: Healthy/Resources/
output_dir: Healthy/Resources/Generated

strings:
  inputs:
    - Localization/Localizable.strings
  outputs:
    - templateName: structured-swift5
      output: Strings.Generated.swift

xcassets:
  - inputs:
      - Colors.xcassets
    outputs:
      - templateName: swift5
        params:
          enumName: Colors
          forceProvidesNamespaces: true
        output: Colors.Generated.swift

  - inputs:
      - Assets.xcassets
    outputs:
      - templatePath: SwiftGen-Templates/images.stencil
        params:
          enumName: Images
          forceProvidesNamespaces: true
        output: Assets.Generated.swift

